spring.application.name=rfid-asset-tracking-backend
server.port=8070

# ---- MySQL connection ----
# Point this at the SAME database the admin desktop app uses so both apps share
# one schema. Update credentials to match your MySQL instance.
spring.datasource.url=jdbc:mysql://localhost:3306/rfid_asset_tracking?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update adds the new "locations" and "activity_logs" tables on first run,
# without touching the existing users/inventory_items tables created by the desktop app.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# DEV-ONLY secret below (32 random bytes, base64). Generate your own for anything
# beyond local development, e.g.: openssl rand -base64 32
app.jwt.secret=SCyOv+XIXLSJvs9dgIKzCps36Ao1y/Wasp1ganMGtME=
app.jwt.expiration-ms=86400000

logging.level.root=INFO
logging.level.com.virtualsphere.rfidbackend=DEBUG
